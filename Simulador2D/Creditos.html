<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS DYNAMIC | Créditos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        body {
            background-image: url("../img/ciudad_moderna_fondo.png");
            background-size: auto 100vh;
            background-position: 0 bottom;
            background-repeat: repeat-x;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: moverFondo 30s linear infinite;
        }

        @keyframes moverFondo {
            0% { background-position: 0 bottom; }
            100% { background-position: -100vw bottom; }
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.5);
            z-index: 0;
        }

        /* --- BOTÓN FLOTANTE DE AUDIO --- */
        .audio-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #00bfff;
            border-radius: 10px;
            padding: 8px 14px;
            color: #00bfff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transition: all 0.2s ease;
        }

        .audio-control:hover {
            background: #00bfff;
            color: black;
            box-shadow: 0 0 20px #00bfff;
        }

        .credits-box {
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 25, 0.85);
            border: 2px solid #00bfff;
            padding: 35px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.4);
            backdrop-filter: blur(5px);
            max-width: 450px;
            width: 90%;
        }

        h2 {
            color: #00bfff;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        .nombres-equipo {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .nombres-equipo span {
            display: block;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            margin-top: 6px;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.3);
        }

        button.btn-menu {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            color: white;
            background: rgba(15,15,25,.75);
            border: 2px solid #00bfff;
            border-radius: 10px;
            cursor: pointer;
            transition: all .30s ease;
        }

        button.btn-menu:hover {
            transform: scale(1.03);
            background: #00bfff;
            color: black;
            box-shadow: 0 0 15px #00bfff;
        }
    </style>
</head>

<body>

    <!-- CONTROL DE AUDIO FLOTANTE -->
    <button id="audio-btn" class="audio-control" onclick="toggleAudio()">🔊 Música: ON</button>

    <!-- ELEMENTO DE AUDIO (Ruta desde Simulador2D hacia la carpeta raíz /audio) -->
    <audio id="bg-music" src="../audio/credits.mp3" loop></audio>

    <div class="credits-box">
        <h2>Créditos del Proyecto</h2>
        <div class="nombres-equipo">
            Desarrollado con dedicación por:
            <span>Eric Vázquez Palacios</span>
            <span>Estefania Cruz Muñoz</span>
            <span>Luis Fernando Lopez Leyva</span>
        </div>
        <button class="btn-menu" onclick="window.location.href='Inicio.html'">⬅ Volver al Menú</button>
    </div>

    <script type="module" src="../js/creditos.js"></script>
    
</body>

</html>
