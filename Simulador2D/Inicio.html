<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS DYNAMIC | Menú Simulador 2D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* --- FONDO ANIMADO EN BUCLE --- */
        body {
            background-image: url("../img/ciudad_moderna_fondo.png");
            background-size: auto 100vh;
            background-position: 0 bottom;
            background-repeat: repeat-x;
            
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            position: relative;

            /* Animación del fondo 2D */
            animation: moverFondo 30s linear infinite;
        }

        @keyframes moverFondo {
            0% {
                background-position: 0 bottom;
            }
            100% {
                background-position: -100vw bottom;
            }
        }

        /* Oscurece ligeramente el fondo para resaltar los menús */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.35);
            z-index: 0;
        }

        /* --- ANIMACIÓN DEL PERSONAJE (SPRITESHEET) --- */
        .personaje {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            
            width: 150px;  
            height: 200px; 
            
            background-image: url("../img/personaje_sprite.png"); 
            background-repeat: no-repeat;
            
            animation: correr 0.8s steps(6) infinite;
        }

        @keyframes correr {
            from { background-position: 0px 0; }
            to { background-position: -900px 0; }
        }

        /* --- CONTENEDORES DE MENÚS --- */
        .menu-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .oculto {
            display: none !important;
        }

        h2.titulo-menu {
            color: white;
            margin-bottom: 25px;
            font-size: 34px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00bfff;
        }

        button {
            width: 320px;
            padding: 18px;
            margin: 12px;
            font-size: 22px;
            color: white;
            background: rgba(15,15,25,.75);
            border: 2px solid #00bfff;
            border-radius: 12px;
            cursor: pointer;
            transition: all .30s ease;
            backdrop-filter: blur(4px);
        }

        button:hover {
            transform: scale(1.05);
            background: #00bfff;
            color: black;
            box-shadow: 
                0 0 15px #00bfff,
                0 0 30px #00bfff;
        }

        button:active {
            transform: scale(.97);
        }
    </style>
</head>

<body>

    <!-- PERSONAJE EN MOVIMIENTO -->
    <div class="personaje"></div>

    <!-- MENÚ PRINCIPAL 2D -->
    <div class="menu-container" id="menu-principal">
        <h2 class="titulo-menu">SIMULADOR 2D</h2>
        <button id="inicio" onclick="mostrarNiveles()">🚆 Iniciar</button>
        <!-- Conectado para redirigir a la página de créditos -->
        <button id="creditos" onclick="window.location.href='Creditos.html'">👥 Créditos</button>
        <button id="salir" onclick="window.location.href='index.html'">❌ Salir</button>
    </div>

    <!-- MENÚ DE NIVELES 2D (Oculto inicialmente) -->
    <div class="menu-container oculto" id="menu-niveles">
        <h2 class="titulo-menu">Selecciona un Nivel</h2>
        
        <button onclick="window.location.href='Nivel1.html'">Nivel 1: Gestión</button>
        <button onclick="window.location.href='Nivel2.html'">Nivel 2: Incidentes</button>
        <button onclick="window.location.href='Nivel3.html'">Nivel 3: Estrategia</button>
        
        <button onclick="mostrarPrincipal()" style="border-color: #ff4444; margin-top: 20px;">⬅ Volver</button>
    </div>

    <!-- LÓGICA DE INTERACCIÓN INTERNA -->
    <script>
        function mostrarNiveles() {
            document.getElementById('menu-principal').classList.add('oculto');
            document.getElementById('menu-niveles').classList.remove('oculto');
        }

        function mostrarPrincipal() {
            document.getElementById('menu-niveles').classList.add('oculto');
            document.getElementById('menu-principal').classList.remove('oculto');
        }
    </script>

</body>

</html>
